# Adım 1: yalnızca HTTP. certbot --nginx sertifikayı ve 443 bloğunu bu dosyaya ekler.
# nginx -t hatasız geçtikten sonra certbot çalıştırın (bkz. deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name varynth.zuzia.dev;

    client_max_body_size 2m;
    server_tokens off;

    # Kayıtlı kullanıcının upstream senkronunu tetiklemesi engellenir (yönetim işi).
    location = /v1/models/sync {
        return 404;
    }

    # API: yalnızca /v1 altı.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off; # SSE akışı için
    }

    # Web konsolu (Next.js): geri kalan her şey.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
