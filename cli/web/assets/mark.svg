<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="vCyanViolet" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="vCoreGlow" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="vFacetLeft" x1="8" y1="10" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="vFacetRight" x1="40" y1="10" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbital Quantum Ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#vCyanViolet)" stroke-width="1.2" stroke-dasharray="6 3.5" opacity="0.65" />
  <circle cx="24" cy="24" r="18" stroke="url(#vCyanViolet)" stroke-width="0.8" opacity="0.25" />

  <!-- Outer Singularity Shield Hexagon -->
  <polygon points="24,5 40.5,14.5 40.5,33.5 24,43 7.5,33.5 7.5,14.5" fill="url(#vCoreGlow)" stroke="url(#vCyanViolet)" stroke-width="1.4" stroke-linejoin="round" />

  <!-- Holographic Facet Left Wing -->
  <path d="M7.5 14.5L24 24V43L7.5 33.5V14.5Z" fill="url(#vFacetLeft)" opacity="0.45" />

  <!-- Holographic Facet Right Wing -->
  <path d="M40.5 14.5L24 24V43L40.5 33.5V14.5Z" fill="url(#vFacetRight)" opacity="0.3" />

  <!-- Precision Converging Quantum "V" -->
  <path d="M13 14L24 36L35 14" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#vGlow)" />
  <path d="M17 14L24 30L31 14" stroke="url(#vCyanViolet)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Apex Singularity Core Nodes -->
  <circle cx="24" cy="5" r="2" fill="#38bdf8" />
  <circle cx="24" cy="24" r="2.5" fill="#ffffff" />
  <circle cx="24" cy="36" r="2.2" fill="#c084fc" />
  <circle cx="13" cy="14" r="2" fill="#38bdf8" />
  <circle cx="35" cy="14" r="2" fill="#c084fc" />
</svg>
